<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — tq2ka</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    :root{--bg:#f7f7fa;--ink:#16171f;--muted:#5d5f6e;--pink:#e0306a;color-scheme:light}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1016;--ink:#ecedf3;--muted:#a3a5b5;--pink:#ff4f86;color-scheme:dark}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-content:center;justify-items:center;gap:22px;padding:24px 16px;background:var(--bg);color:var(--ink);font:400 18px/1.5 'Onest',system-ui,sans-serif;text-align:center}
    .script{margin:0;font:600 30px/1 'Caveat',cursive;color:var(--pink);transform:rotate(-3deg)}
    h1{margin:0;font:500 clamp(96px,22vw,220px)/.85 'Cormorant Garamond',serif;letter-spacing:-.03em}
    p{margin:0;color:var(--muted)}
    a{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;background:var(--pink);color:#fff;font-weight:500;text-decoration:none;transition:background-color .25s}
    a:hover{background:var(--ink);color:var(--bg)}
    a:focus-visible{outline:2px solid var(--pink);outline-offset:4px}
  </style>
</head>
<body>
  <p class="script">тут ничего не огранено</p>

  <p>Такой страницы на tq2ka.ru нет.</p>

</html>
